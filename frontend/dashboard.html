<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Campus Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .status-present { color: var(--success-color); font-weight: bold; }
        .status-absent { color: var(--error-color); font-weight: bold; }
        .action-btn { 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 15px;
            transition: var(--transition);
        }
        .action-btn:hover { background: var(--accent-color); }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
            resize: none;
        }
        .stats p { margin-bottom: 10px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SMART CAMPUS</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Attendance</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-file-invoice"></i>
                    <span>Results</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-bell"></i>
                    <span>Announcements</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <button class="logout-btn-sidebar" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1 id="userRole">Dashboard</h1>
                </div>
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">User</span>
                </div>
            </header>

            <div id="dashboardContent">
                <!-- Content will be injected by JavaScript -->
                <div class="loading">Loading dashboard...</div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
